<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Penales</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#112b27}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 38%,#347c59,#173e36 60%,#10251f);text-align:center}.wrap{max-width:550px;margin:auto;padding:22px 16px 40px}h1{font-size:29px;margin:8px 0}#score{font-size:20px;font-weight:800;margin:14px 0}#status{min-height:53px;line-height:1.4;color:#f8e8be;margin:12px 0}.pitch{margin:16px auto 0;max-width:470px;padding:30px 10px 28px;border:2px solid #ffffff75;border-bottom:0;background:repeating-linear-gradient(90deg,#ffffff08 0 38px,#00000008 38px 76px);border-radius:8px 8px 0 0}.goal{position:relative;width:100%;aspect-ratio:1.6/1;border:8px solid #f5f5f2;border-bottom-width:5px;box-shadow:0 0 0 3px #132c29,0 12px 28px #0005;background:repeating-linear-gradient(90deg,#ffffff18 0 1px,transparent 1px 13%),repeating-linear-gradient(0deg,#ffffff18 0 1px,transparent 1px 17%),#6b9f8277;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);overflow:visible}.keeper{position:absolute;z-index:2;left:50%;bottom:0;height:88%;max-width:48%;object-fit:contain;object-position:bottom;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(2px 5px 3px #0009)}.shot-ball{position:absolute;z-index:4;font-size:40px;left:50%;top:110%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(2px 4px 3px #0009)}button.sector{position:relative;z-index:1;border:1px solid #e9fff254;background:#17604544;color:#fff;cursor:pointer;touch-action:manipulation;font-size:34px;transition:background .15s}button.sector:active{background:#eac95899}button.sector:disabled{cursor:default;opacity:.8}.ball{font-size:48px;margin-top:-16px;filter:drop-shadow(2px 4px 3px #0008)}#history{margin:18px auto;text-align:left;max-width:430px;font-size:14px;color:#d4e5da}#history p{margin:6px 0}.hint{font-size:13px;opacity:.8;margin:10px 0}#refresh{background:#e8ba50;border:0;border-radius:10px;padding:12px 20px;font-weight:800;color:#1e2620;cursor:pointer;margin-top:10px}
</style></head><body><div class="wrap"><h1 id="title">⚽ Penales</h1><div id="score">Cargando…</div><div id="status">Preparando el partido</div><div class="pitch"><div class="goal" id="goal"></div></div><div class="ball">⚽</div><div class="hint">Tocá un sector del arco. El resultado se revela después del tiro.</div><button id="refresh">Actualizar</button><button id="again" style="display:none;margin-left:8px">Otra tanda</button><div id="history"></div></div><script>
const app=window.Telegram?.WebApp;app?.ready();app?.expand();const game=new URLSearchParams(location.search).get('game');const goal=document.querySelector('#goal'),statusEl=document.querySelector('#status'),score=document.querySelector('#score'),history=document.querySelector('#history');let state=null,busy=false;
async function request(action,sector){if(!app?.initData)throw Error('Abrí el arco desde el botón del bot en Telegram.');const res=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:app.initData,game,action,sector})});const payload=await res.json();if(!res.ok)throw Error(payload.error||'Falló la conexión.');return payload}
async function animateShot(result){const keeper=goal.querySelector('.keeper');if(!keeper||!result)return;const ball=document.createElement('span');ball.className='shot-ball';ball.textContent='⚽';goal.append(ball);const w=goal.clientWidth,h=goal.clientHeight,kx=(result.save%3-1)*w*.29,ky=(Math.floor(result.save/3)-2)*h*.24,bx=(result.kick%3-1)*w/3,by=(Math.floor(result.kick/3)-1)*h/3-h*.6;const dive=keeper.animate([{transform:'translateX(-50%) rotate(0deg)'},{transform:`translate(calc(-50% + ${kx}px),${ky}px) rotate(${kx<0?-28:kx>0?28:0}deg)`}],{duration:850,easing:'ease-out',fill:'forwards'});const shot=ball.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${bx}px),${by}px) scale(.55)`}],{duration:650,easing:'ease-in',fill:'forwards'});await Promise.all([dive.finished,shot.finished]);statusEl.textContent=result.goal?'¡GOL! ⚽':'¡ATAJÓ EL DIBU! 🧤';app?.HapticFeedback?.notificationOccurred(result.goal?'success':'warning');await new Promise(resolve=>setTimeout(resolve,700));dive.cancel();shot.cancel();ball.remove()}
function render(s){state=s;const solo=s.mode==='solo';goal.classList.toggle('solo',solo);document.querySelector('#title').textContent=solo?'🧤 Pateale al Dibu':'⚽ Penales';score.textContent=solo?`Goles: ${s.scores[0]} / ${s.shots[0]} tiros`:`${s.players[0]} ${s.scores[0]} — ${s.scores[1]} ${s.players[1]}`;document.querySelector('#again').style.display=solo&&s.status==='finished'?'inline-block':'none';let who=s.role==='kicker'?'PATEÁS':'ATAJÁS';statusEl.textContent=solo?(s.status==='finished'?`Terminó: ${s.scores[0]} goles en cinco tiros. ¿Otra tanda?`:`Intento ${s.turn+1} de 5: elegí dónde patear.`):s.status==='finished'?`Terminó. Ganó ${s.players[s.winner]}.`:s.status==='waiting'?'Esperando rival…':s.selected?'Ya elegiste. Esperando al otro jugador…':`Penal ${s.turn+1}: ${who}. Elegí dónde ${s.role==='kicker'?'patear':'tirarte'}.`;goal.replaceChildren();for(let i=0;i<9;i++){const b=document.createElement('button');b.className='sector';b.type='button';b.setAttribute('aria-label',`Sector ${i+1}`);b.textContent=(s.status==='playing'&&!s.selected&&s.role)?'·':'';b.disabled=busy||s.status!=='playing'||s.selected||!s.role;b.onclick=async()=>{if(busy)return;busy=true;try{statusEl.textContent='¡Pateaste!';const {state:next,outcome}=await request('pick',i);if(solo&&outcome?.result)await animateShot(outcome.result);render(next);if(!solo)app?.HapticFeedback?.notificationOccurred('success')}catch(e){statusEl.textContent=e.message}finally{busy=false;if(state)render(state)}};goal.append(b)}if(solo){const keeper=document.createElement('img');keeper.className='keeper';keeper.src='/dibu.png';keeper.alt='Dibu, arquero dibujado';goal.append(keeper)}history.replaceChildren(...s.results.slice(-6).reverse().map(r=>{const p=document.createElement('p');p.textContent=`Penal ${r.number} · ${s.players[r.kicker]}: ${r.goal?'GOL ⚽':'ATAJADO 🧤'} · tiro ${r.kick+1}, arquero ${r.save+1}`;return p}))}
async function refresh(){try{const {state:s}=await request('state');render(s)}catch(e){statusEl.textContent=e.message}}document.querySelector('#refresh').onclick=refresh;document.querySelector('#again').onclick=async()=>{try{const {state:s}=await request('restart');render(s)}catch(e){statusEl.textContent=e.message}};refresh();setInterval(()=>{if(state?.status==='playing'&&state.mode!=='solo'&&document.visibilityState==='visible'&&!busy)refresh()},2500);
</script></body></html>
